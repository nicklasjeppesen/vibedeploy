{{define "content"}}
<section class="narrow card">
  <h1>Vælg en ny adgangskode</h1>
  <p class="muted">Kontoen tilhører {{.Data.Name}}. Når du gemmer, bliver du logget ud alle andre steder.</p>
  {{if .Data.Err}}<div class="note bad" role="alert">{{.Data.Err}}</div>{{end}}
  <form method="post" class="stack">
    <label>Ny adgangskode<input type="password" name="password" minlength="12" autocomplete="new-password" required>
      <span class="hint">Mindst 12 tegn.</span></label>
    <label>Skriv den igen<input type="password" name="password2" minlength="12" autocomplete="new-password" required></label>
    <button class="btn big">Gem ny adgangskode</button>
  </form>
</section>
{{end}}
