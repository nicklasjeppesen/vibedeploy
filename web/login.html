{{define "content"}}
<section class="narrow card">
  <h1>Log ind</h1>
  {{if .Data.Err}}<div class="note bad" role="alert">{{.Data.Err}}</div>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label>Adgangskode<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn big">Log ind</button>
  </form>
  <details class="small muted gap">
    <summary>Glemt adgangskode?</summary>
    <p>Bed ejeren af serveren om et link til en ny adgangskode (under Personer).</p>
    <p>Er du selv ejeren, så log ind på serveren, og kør <code>sudo vibedeploy reset-password din@email.dk</code>. Den giver dig et link.</p>
  </details>
</section>
{{end}}
