# Udgiver en release, når der pushes et tag som v0.2.0. Filerne er det, install.sh henter:
# vibedeploy-linux-amd64, vibedeploy-linux-arm64 og install.sh selv.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Byg til Linux (uden cgo)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/vibedeploy-linux-$arch .
          done
          sed "s#nicklasjeppesen/vibedeploy#${GITHUB_REPOSITORY}#g" install.sh > dist/install.sh
      - name: Udgiv
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
