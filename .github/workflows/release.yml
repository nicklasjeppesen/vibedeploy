# Udgiver en release, når der pushes et tag som v0.2.0. Filerne er det, install.sh og opdateringen henter:
# vibedeploy-linux-amd64, vibedeploy-linux-arm64, install.sh, release.json og release.json.sig.
#
# Signering: læg den hemmelige nøgle fra «go run . keygen» i secret VIBEDEPLOY_SIGNING_KEY, og den
# offentlige i releasekey.go. Uden secret udgives releasen usigneret, og servere opdaterer sig ikke til den.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Byg til Linux (uden cgo)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.releaseRepo=${GITHUB_REPOSITORY}" \
              -o dist/vibedeploy-linux-$arch .
          done
          sed "s#nicklasjeppesen/vibedeploy#${GITHUB_REPOSITORY}#g" install.sh > dist/install.sh
      - name: Signér
        env:
          VIBEDEPLOY_SIGNING_KEY: ${{ secrets.VIBEDEPLOY_SIGNING_KEY }}
        run: |
          if [ -z "$VIBEDEPLOY_SIGNING_KEY" ]; then
            echo "::warning::VIBEDEPLOY_SIGNING_KEY mangler: releasen er usigneret, og servere opdaterer sig ikke selv til den."
            exit 0
          fi
          go run . sign -version "$GITHUB_REF_NAME" \
            -notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" dist
      - name: Udgiv
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
